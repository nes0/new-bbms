# Runs on every push and pull request: lint, then the test suite against PostgreSQL.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bbms
          POSTGRES_PASSWORD: bbms
          POSTGRES_DB: bbms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bbms" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DEBUG: "False"
      SECRET_KEY: ci-only-not-secret-ci-only-not-secret-0123456789-abcdefghijklmnop
      DATABASE_URL: postgres://bbms:bbms@localhost:5432/bbms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      # Fails on Django's own security checks. The app's "not configured" warnings (payments, email, Discord, ...) and
      # the OAuth toolkit's RFC 9700 notices are still printed, but CI has no real keys so they can't fail the build.
      - run: |
          python manage.py check --deploy 2>&1 | tee deploy-check.txt
          if grep -E '\(security\.W' deploy-check.txt; then echo "Django security warnings above"; exit 1; fi
        env:
          ALLOWED_HOSTS: bbms.buildbrighton.com
          ID_DOCUMENT_KEYS: aQWajohxse7vEZwzCxE6dD7-5rH69c0vj9oYwNe_LjQ=  # CI only, encrypts nothing real
          SECURE_SSL_REDIRECT: "True"
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py collectstatic --noinput
      - run: python manage.py test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bbms .
