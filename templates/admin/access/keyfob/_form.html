<form method="post">
  {% csrf_token %}
  {{ form.non_field_errors }}
  <fieldset class="module aligned">
    {% for field in form %}
      <div class="form-row">
        {{ field.errors }}
        {{ field.label_tag }} {{ field }}
        {% if field.help_text %}<div class="help">{{ field.help_text }}</div>{% endif %}
      </div>
    {% endfor %}
  </fieldset>
  <div class="submit-row"><input type="submit" class="default" value="{{ submit_label }}"></div>
</form>
