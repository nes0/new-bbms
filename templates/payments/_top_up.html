{% load money %}
<form method="post" action="{% url 'payments:pay-card' %}" class="stack">
  {% csrf_token %}
  <input type="hidden" name="item" value="top-up">
  {% if back %}<input type="hidden" name="back" value="{{ back }}">{% endif %}
  <label>Amount (£) <input type="number" name="amount" min="0" step="0.01" required></label>
  <span class="hint">Between {{ top_up_low|pounds }} and {{ top_up_high|pounds }}.</span>
  <button type="submit">Top up by card</button>
  {% if has_direct_debit %}<button type="submit" formaction="{% url 'payments:pay-direct-debit' %}">Top up by Direct Debit</button>{% endif %}
  {% if paypal %}<button type="submit" formaction="{% url 'payments:pay-paypal' %}">Top up by PayPal</button>{% endif %}
</form>
