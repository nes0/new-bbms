[project]
name = "bbms"
version = "0.1.0"
description = "Build Brighton Member System"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"

# Dependencies are listed in requirements.in / requirements.txt (pinned), not here.

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["BBMSDoorEntry", "*/migrations/*"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade, Django-specific checks
select = ["E", "W", "F", "I", "B", "UP", "DJ"]

[tool.coverage.run]
# CI: coverage run manage.py test, then coverage report. Paths are kept relative so the CI badge action can read them.
source = ["apps", "bbms"]
omit = ["*/migrations/*", "*/tests/*", "*/tests.py"]
branch = true
relative_files = true

[tool.coverage.report]
skip_covered = true
show_missing = true
